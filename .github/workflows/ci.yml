name: Python and Docker CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test application health
        run: |
          python -c "from app import app; client = app.test_client(); response = client.get('/health'); assert response.status_code == 200; assert response.get_json()['status'] == 'healthy'"

      - name: Build Docker image
        run: docker build -t aws-devops-app .
